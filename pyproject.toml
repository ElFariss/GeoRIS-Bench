[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georis-bench"
version = "0.1.0"
description = "A Geospatially Grounded Electromagnetic Benchmark for RIS-Aided Wireless Communications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.8", "pillow>=11,<13"]

[project.optional-dependencies]
dataset = ["h5py>=3.14,<4", "pyarrow>=20,<25", "pandas>=2.2,<3.1"]
gis = ["shapely>=2,<3", "pyproj>=3.6", "rasterio>=1.4", "trimesh>=4", "embreex", "lxml>=5"]
simulation = ["sionna-rt==2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
